name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration check diffs against the PR base. A depth-1 checkout
          # has no parents, so `base...HEAD` reports "no merge base".
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Advisory policy
        run: node scripts/check-advisories.mjs
      - name: Migration declaration
        run: |
          git fetch origin ${{ github.base_ref }}
          node scripts/check-migrations.mjs origin/${{ github.base_ref }}
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
