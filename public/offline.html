<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline · TRONX</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:#171717;
        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
      main{max-width:360px}
      img{width:72px;height:72px;border-radius:18px}
      h1{margin:20px 0 8px;font-size:22px;letter-spacing:-.01em}
      p{margin:0;color:#525252;font-size:15px;line-height:1.5}
      button{margin-top:24px;height:46px;padding:0 28px;border:0;border-radius:999px;background:#171717;color:#fff;
        font-size:15px;font-weight:600;cursor:pointer}
      button:active{transform:scale(.98)}
      small{display:block;margin-top:16px;color:#a3a3a3;font-size:12px}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="TRONX" width="72" height="72" />
      <h1>You&rsquo;re offline</h1>
      <p>We can&rsquo;t reach TRONX right now. Menus, orders and bills need a connection so they&rsquo;re always up to date.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>We&rsquo;ll reconnect automatically when you&rsquo;re back online.</small>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
